name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: studibackend_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Code auschecken
        uses: actions/checkout@v7

      - name: JDK 25 einrichten
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Kompilieren und testen
        working-directory: studibackend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/studibackend_dev
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: ./mvnw -B clean verify

      - name: Test-Reports als Artifact sichern
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: studibackend/target/surefire-reports/
          retention-days: 7
