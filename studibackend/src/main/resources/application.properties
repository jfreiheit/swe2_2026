spring.application.name=studi

# Aktives Profil: dev (lokale Entwicklung) oder prod (Deployment), steuerbar per Umgebungsvariable.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Lokale, per .gitignore ausgeschlossene Property-Datei mit echten Zugangsdaten (optional).
spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/studibackend_dev}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
